name: Android APK Yig'uvchi

on:
  push:
    branches: [ "main", "master" ] # main yoki master branchga kod yuklansa ishlaydi
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-style: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle (APK yaratish)
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: QarzDaftar-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
